server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:railway_works;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  sql:
    init:
      # 生产 schema.sql 是 MySQL 方言（CREATE DATABASE / 生成列），测试库表由 Hibernate 从实体生成
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: WARN
    com.railway.works: INFO
